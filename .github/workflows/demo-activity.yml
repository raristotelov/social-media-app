name: Demo activity

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the demo activity run
        env:
          DEMO_ACTIVITY_URL: ${{ secrets.DEMO_ACTIVITY_URL }}
          DEMO_ACTIVITY_TOKEN: ${{ secrets.DEMO_ACTIVITY_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            -X POST \
            -H "Authorization: Bearer ${DEMO_ACTIVITY_TOKEN}" \
            "${DEMO_ACTIVITY_URL}/internal/demo-activity"
